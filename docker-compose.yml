# One command: `docker compose up --build`  ->  web on :3000, realtime/API on :4000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: willio
      POSTGRES_PASSWORD: willio
      POSTGRES_DB: willio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U willio -d willio']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      NODE_ENV: production
      PORT_SERVER: 4000
      DATABASE_URL: postgresql://willio:willio@postgres:5432/willio
      REDIS_URL: redis://redis:6379
      # CHANGE THIS for anything beyond a local demo.
      JWT_SECRET: ${JWT_SECRET:-willio-compose-demo-secret-please-change}
      # Comma-separated allowlist; empty accepts any origin (handy for LAN demos).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ROOM_MAX_USERS: ${ROOM_MAX_USERS:-50}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-true}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
